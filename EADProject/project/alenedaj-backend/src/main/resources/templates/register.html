<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register - ale nedaj</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>
<div class="container">
    <header>
        <div class="logo_container">
            <img src="/images/logo-2.png" alt="">
            <img src="/images/logo_text2.png" alt="">
        </div>
    </header>
    <section class="form-section">
        <h2 id="registerTitle">Register</h2>
        <form class="registerForm">
            <div class="inputs">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required />
            </div>
            <div class="inputs">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required />
            </div>
            <div class="inputs">
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required />
            </div>
            <div id="verificationCodeDiv" style="display: none;">
                <label for="verificationCode">Verification Code:</label>
                <input type="text" id="verificationCode" name="verificationCode" placeholder="Enter code" />
            </div>

            <div class="verification-section">
                <button type="button" id="sendVerificationBtn">
                    Send Verification
                </button>
                <span id="spinner" class="spinner" style="display:none;"></span>
                <span id="countdown"></span>
            </div>



            <button type="submit" class="button">Register</button>
        </form>
        <p style="text-align: center; margin-top: 15px;">
            Already have an account? <a href="/auth/login" class="register">Login here</a>.
        </p>
    </section>
</div>

<script>
    const sendBtn = document.getElementById('sendVerificationBtn');
    const countdownSpan = document.getElementById('countdown');
    const verificationDiv = document.getElementById('verificationCodeDiv');

    sendBtn.addEventListener('click', function () {
        const email = document.getElementById('email').value.toLowerCase();
        if (!email) {
            alert('Please enter your email first.');
            return;
        }
        sendBtn.disabled = true;
        spinner.style.display = 'inline-block';
        verificationDiv.style.display = 'block';

        fetch('/auth/api/send-verification?email=' + encodeURIComponent(email), {
            method: 'POST'
        })
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    alert(data.error);
                    if (data.error.includes("already exists")) {
                        window.location.href = '/auth/login';
                    }
                    sendBtn.disabled = false;
                    spinner.style.display = 'none';
                } else {
                    alert(data.message);
                    spinner.style.display = 'none';
                    startCountdown(300);
                }
            })
            .catch(error => {
                console.error('Error sending verification:', error);
                sendBtn.disabled = false;
                spinner.style.display = 'none';
            });
    });

    function startCountdown(seconds) {
        let counter = seconds;
        countdownSpan.textContent = ` (Resend in ${counter}s)`;
        const interval = setInterval(() => {
            counter--;
            countdownSpan.textContent = ` (Resend in ${counter}s)`;
            if (counter <= 0) {
                clearInterval(interval);
                countdownSpan.textContent = '';
                sendBtn.disabled = false;
            }
        }, 1000);
    }

    document.getElementById('registerForm').addEventListener('submit', function (e) {
        e.preventDefault();

        const formData = {
            name: document.getElementById('name').value,
            email: document.getElementById('email').value.toLowerCase(),
            password: document.getElementById('password').value,
            verificationCode: document.getElementById('verificationCode').value
        };

        fetch('/auth/api/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(formData)
        })
            .then(response => response.json().then(data => ({ status: response.status, body: data })))
            .then(({ status, body }) => {
                if (status >= 400) {
                    alert("Registration error: " + body.error);
                    if (body.error.includes("already exists")) {
                        window.location.href = '/auth/login';
                    }
                } else {
                    alert(body.message);
                    window.location.href = '/auth/login';
                }
            })
            .catch(error => {
                console.error('Registration error:', error);
                alert('Registration error: ' + error.message);
            });
    });
</script>
</body>
</html>
