<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login</title>
</head>
<!-- Pass the entire body content via the complete fragment expression syntax -->
<body th:replace="~{layout :: base(~{::body})}">
<div>
    <h2>Login</h2>
    <form th:action="@{/api/auth/login}" method="post" id="loginForm">
        <div>
            <label for="email">Email:</label>
            <input type="email" name="email" id="email" required />
        </div>
        <div>
            <label for="password">Password:</label>
            <input type="password" name="password" id="password" required />
        </div>
        <button type="submit">Login</button>
    </form>
    <div id="loginMessage"></div>
    <script>
        // Example using the Fetch API for login form submission
        document.getElementById("loginForm").addEventListener("submit", function (e) {
            e.preventDefault();
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            fetch(this.action, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email, password })
            })
                .then(response => response.json())
                .then(data => {
                    document.getElementById("loginMessage").innerText = data.message;
                    if (data.message === "Login successful") {
                        window.location.href = "/dashboard";
                    }
                })
                .catch(error => {
                    document.getElementById("loginMessage").innerText = "An error occurred";
                });
        });
    </script>
</div>
</body>
</html>
